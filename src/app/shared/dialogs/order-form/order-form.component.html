<div class="modal-content p-4 rounded-4 shadow-lg">
  <div class="modal-header border-0 pb-2 d-flex justify-content-between align-items-center">
    <h3 class="modal-title fw-bold mb-0">{{ data.title || 'Зробити замовлення' }}</h3>
    <button
      type="button"
      class="modal-close btn-plain"
      [title]="data.cancelButtonText || 'Закрити'"
      matDialogClose>
      <span class="icon icon_close"></span>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submitForm()" class="mt-3 h-50">
    <div class="modal-body px-0">

      <div class="mb-3">
        <label class="form-label fw-500">Ваше ім’я *</label>
        <input type="text" class="form-control border border-2 rounded-3" formControlName="name" placeholder="Введіть ім’я">
      </div>

      <div class="mb-3">
        <label class="form-label fw-500">Номер телефону *</label>
        <input type="tel" class="form-control border border-2 rounded-3" formControlName="phone" placeholder="+380...">
      </div>

      <div class="mb-3">
        <label class="form-label fw-500">Email (необов’язково)</label>
        <input type="email" class="form-control border border-2 rounded-3" formControlName="email" placeholder="you@example.com">
      </div>

      <div class="mb-3">
        <label class="form-label fw-500">Тип послуги *</label>
        <select class="form-select border border-2 rounded-3" formControlName="service">
          <option value="">Оберіть тип</option>
          <option value="3D друк">3D друк</option>
          <option value="3D моделювання">3D моделювання</option>
          <option value="3D сканування">3D сканування</option>
          <option value="Консультація">Консультація</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label fw-500">Коментар / опис</label>
        <textarea class="form-control border border-2 rounded-3" rows="3" formControlName="comment"
                  placeholder="Опишіть ваш запит..."></textarea>
      </div>
      <div class="form-check my-3">
        <input class="form-check-input" type="checkbox" formControlName="personalData" id="personalData">
        <label class="form-check-label small text-muted" for="personalData">
          Погоджуюсь на обробку персональних даних
        </label>
      </div>
    </div>

    <div class="modal-footer border-0 pt-3 d-flex justify-content-center">
      <button type="submit" class="btn btn-custom border border-2 rounded-3 py-2 fw-500 w-75">
        {{ data.applyButtonText || 'Зробити замовлення' }}
      </button>
    </div>
  </form>
</div>
